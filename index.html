<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friez n Burgz | Admin Dashboard</title>
    <link rel="stylesheet" href="static/css/style.css">
    <link rel="stylesheet" href="static/css/allergen-editor.css">
    <link rel="stylesheet" href="static/css/allergen-incidents.css">
    <link rel="stylesheet" href="static/css/allergen-print.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:wght@800;900&family=Futura:wght@400&family=Montserrat:wght@800&display=swap"
        rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Firebase SDKs - Compat versions for easier integration with older patterns -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-functions-compat.js"></script>

    <!-- Third-party Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
</head>

<body>
    <!-- 1. Authentication Container (Login/Signup) -->
    <div class="auth-container" id="authContainer">
        <div class="auth-card">
            <img src="assets/logo-alt.png" alt="Friez n Burgz Logo" class="auth-logo">
            <h2 class="auth-title">Employee Login</h2>
            <input type="email" id="loginEmail" placeholder="Email" class="auth-input">
            <input type="password" id="loginPassword" placeholder="Password" class="auth-input">
            <button id="loginBtn" class="auth-button email-login-btn">Login with Email</button>
            <div class="divider">OR</div>
            <button id="googleLoginBtn" class="auth-button google-login-btn">
                <i class="fab fa-google"></i> Sign in with Google
            </button>
            <p id="authMessage" class="auth-message"></p>
        </div>
    </div>

    <!-- 2. Location Selection Container (Shown after login, before main app) -->
    <div class="location-selection-container" id="locationSelectionContainer">
        <div class="location-selection-card">
            <img src="assets/logo-alt.png" alt="Friez n Burgz Logo" class="auth-logo">
            <h2 class="auth-title">Select Your Location</h2>
            <div class="select-wrapper">
                <select id="locationSelect" class="location-select"></select>
                <i class="fas fa-chevron-down select-arrow"></i>
            </div>
            <button id="confirmLocationBtn" class="auth-button">Confirm Location</button>
            <button id="logoutBtn" class="header-button">Logout</button>
        </div>
        </header>
        <div id="modalFooter" class="modal-footer">
            <!-- Dynamic buttons/actions -->
        </div>
    </div>
    </div>

    <!-- Main JavaScript file - acts as the orchestrator -->
    <script type="module" src="main.js"></script>
    <script src="import-data.js"></script>
    <script type="module" src="import-menu-items.js"></script>
</body>

</html>
